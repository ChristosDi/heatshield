{% extends 'base.html' %}

{% block title %}
  Sign in - HeatShield
{% endblock %}

{% block content %}
  <div class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
    <div class="card shadow border-0 rounded-4" style="max-width: 450px; width: 100%;">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
          <h1 class="h3 fw-bold text-primary">HeatShield</h1>
          <p class="text-muted mb-0">Staff sign in</p>
        </div>

        {% if form.errors %}
          <div class="alert alert-danger" role="alert">Your username or password is incorrect. Please try again.</div>
        {% endif %}

        <form method="post">
          {% csrf_token %}

          <div class="mb-3">
            <label for="{{ form.username.id_for_label }}" class="form-label fw-semibold">Username</label>
            <input type="text" name="{{ form.username.html_name }}" id="{{ form.username.id_for_label }}" class="form-control form-control-lg" placeholder="Enter your username" required autofocus />
          </div>

          <div class="mb-4">
            <label for="{{ form.password.id_for_label }}" class="form-label fw-semibold">Password</label>
            <input type="password" name="{{ form.password.html_name }}" id="{{ form.password.id_for_label }}" class="form-control form-control-lg" placeholder="Enter your password" required />
          </div>

          <input type="hidden" name="next" value="{{ next }}" />

          <button type="submit" class="btn btn-primary btn-lg w-100">Sign in</button>
        </form>

        <p class="text-center text-muted small mt-4 mb-0">HeatShield Staff Dashboard</p>
      </div>
    </div>
  </div>
{% endblock %}

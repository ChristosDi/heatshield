{% extends "base.html" %}

{% block title %}Sign in - HeatShield{% endblock %}

{% block content %}
  <h1>Staff sign in</h1>
  {% if form.errors %}
    <p>Your username or password is wrong. Please try again.</p>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Sign in</button>
  </form>
{% endblock %}
